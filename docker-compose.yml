services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_backend_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/eve_backend?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=DiagBooking@2026#SecretKey
      - JWT_EXPIRES_IN=1d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eve_network

  postgres:
    image: postgres:16-alpine
    container_name: eve_backend_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eve_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_backend"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

  redis:
    image: redis:7-alpine
    container_name: eve_backend_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

volumes:
  postgres_data:
  redis_data:

networks:
  eve_network:
    driver: bridge
